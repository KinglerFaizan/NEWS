name: Restore app.py

on:
  push:
    paths:
      - ".github/workflows/restore-app.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good app.py
        run: |
          git checkout 5a2219d3bb5498ca7b2860298231baf21b32a8a4 -- app.py
          sed -i 's/max_workers=6/max_workers=3/g' app.py
          sed -i 's/value=5, step=5,/value=0, step=5,/' app.py
          python -m py_compile app.py
      - name: Commit restored app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Restore app.py after indentation corruption" || exit 0
          git push
